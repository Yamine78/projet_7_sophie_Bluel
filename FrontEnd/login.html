<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Login - Sophie Bluel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/login.css">
</head>
<body class="login-page">
<header>
    <h1>Sophie Bluel<span>ARCHITECTE D'INTÉRIEUR</span></h1>
    
    <nav>
        <ul>
            <li><a href="index.html">projets</a></li>
            <li><a href="#contact">contact</a></li>

            <li><img src="./assets/icons/instagram.png" alt="Instagram"></li>
        </ul>
    </nav>
</header>

<main>
    <section id="login-section">
        <h2>Log In</h2>

        <p id="message-erreur"></p>

        <form>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="">

            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="">

            <button type="submit" id="login-button">Se connecter</button>
            <p><a href="#">Mot de passe oublié</a></p>
        </form>
    </section>
</main>

<footer>
    <nav>
        <ul>
            <li>Mentions légales</li>
        </ul>
    </nav>
</footer>
<script src="./assets/login.js"></script>

</body>
</html>
